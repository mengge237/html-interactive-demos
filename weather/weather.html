<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气预报</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        #weather {
            margin-top: 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border:1px solid #ccc;
        }
        #container{
            border:1px solid #ccc;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const apiKey = '2d4f67fe4674fa855252f3211c604126';
            let city = 'Beijing';
            const urlTemplate = `https://api.openweathermap.org/data/2.5/weather?q={city}&appid=${apiKey}&units=metric`;
            const weatherDiv = document.getElementById('weather');
 
            function updateWeather(city) {
                const url = urlTemplate.replace('{city}', city);
 
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.cod === 200) { // 检查响应状态码是否为200（成功）
                            weatherDiv.innerHTML = `
                            <p>城市: ${data.name}</p>
                            <p>天气状况: ${data.weather[0].description}</p>
                            <p>温度: ${data.main.temp}°C</p>
                            <p>湿度: ${data.main.humidity}%</p>
                            `;
                        } else {
                            weatherDiv.innerHTML = `<p>错误代码: ${data.cod}, 信息: ${data.message || '无法获取天气信息'}</p>`;
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        weatherDiv.innerHTML = '<p>请求失败，请检查网络连接或API密钥是否正确。</p>';
                    });
            }
 
            updateWeather(city);
 
            document.querySelector('input[name="city"]').addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    city = this.value;
                    updateWeather(city);
                }
            });
 
            document.querySelector('button').addEventListener('click', function() {
                city = document.querySelector('input[name="city"]').value;
                updateWeather(city);
            });
        });
    </script>
</head>
<body>
    <div id="container">
        <h1>天气预报</h1>
        <input type="text" name="city" placeholder="请输入城市名(英文)">
        <button>查询</button>
        <div id="weather"></div>
    </div>
</body>
</html>
