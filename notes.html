<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes</title>
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="notes">
            <div id="create">
                <i class="fa-solid fa-plus"></i>
                <div class="createBox">
                    <div class="innerCreateBox">
                        <textarea placeholder="Write Here . . ."
                        id="userInput" maxlength="160"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let createBox = document.getElementsByClassName("createBox")[0];
        let input = document.getElementById("userInput");
        let notes = document.getElementsByClassName("notes")[0];
        let i = 0;

        document.getElementById("create").addEventListener("click", function() {
            createBox.style.display = "block";
            input.focus();
        });

        input.addEventListener("keydown", function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Shift+Enter: 插入换行
                    e.preventDefault();
                    // 在光标位置插入换行
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.value = input.value.substring(0, start) + '\n' + input.value.substring(end);
                    input.selectionStart = input.selectionEnd = start + 1;
                } else {
                    // Enter: 保存便签
                    e.preventDefault();
                    if (input.value.trim() !== '') {
                        divStyle(input.value);
                        input.value = "";
                        createBox.style.display = "none";
                    }
                }
            }
        });

        // 点击外部区域关闭输入框
        document.addEventListener('click', function(e) {
            if (!createBox.contains(e.target) && e.target.id !== 'create' && !e.target.classList.contains('fa-plus')) {
                if (input.value.trim() !== '') {
                    divStyle(input.value);
                }
                input.value = "";
                createBox.style.display = "none";
            }
        });

        function content(e){
            if(e.keyCode == '13'){
                divStyle(input.value);
                input.value = "";
                createBox.style.display = "none";
            }
        }

        function color(){
            let randomColors = ['#c2ff3d','#ff3de8','#3dc2ff','#04e022','#bc83e6','#ebb328'];
            if(i > randomColors.length - 1){
                i = 0;
            }
            return randomColors[i++];
        }

        function divStyle(text){
            let div = document.createElement("div");
            div.className = 'note';
            const formattedText = text.replace(/\n/g, '<br>');
            div.innerHTML = '<div class="details">' + '<h3>' + text + '<h3>' +'</div>';

            div.addEventListener("dblclick", function(){
                div.remove();
            });
            div.setAttribute("style", 'background:' + color() + '');

            notes.appendChild(div);
        }


    </script>
</body>
</html>
