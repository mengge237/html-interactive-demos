<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Checkbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/checkbox.css">
</head>
<body>
    <div class="buttons">
        <label>
            <input type="checkbox" id="check" name="check" title="Enable phone" />
            <i class="fa-solid fa-phone"></i>
            <span></span>
        </label>
        <label>
            <input type="checkbox" id="plane" name="check" title="Enable plane" />
            <span></span>
            <i class="fa-sharp fa-solid fa-plane"></i>
        </label>
        <label>
            <input type="checkbox" id="moon" name="check" title="Enable moon" />
            <span></span>
            <i class="fa-solid fa-moon"></i>
        </label>
        <label>
            <input type="checkbox" id="wifi" name="check" title="Enable wifi" />
            <span></span>
            <i class="fa-solid fa-wifi"></i>
        </label>
        <label>
            <input type="checkbox" id="xmark" name="check" title="Enable xmark" />
            <span></span>
            <i class="fa-solid fa-volume-xmark"></i>
        </label>
        <label>
            <input type="checkbox" id="bluetooth" name="check" title="Enable bluetooth" />
            <span></span>
            <i class="fa-brands fa-bluetooth-b"></i>
        </label>
    </div>
</body>
</html>
